<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackJack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div id="login">
    <h2>Logga in</h2>
    <input type="text" id="username" placeholder="Användarnamn">
    <input type="password" id="password" placeholder="Lösenord">
    <button id="loginbtn">Logga in</button>
    <button id="registerbtn">Registrera</button>
    <p id="login-message"></p>
    </div>
    
    <div id="players">

        <div id="player-cards" class="player-cards"><h1>player-cards</h1> 
            <button id="hitbtn" class="hit">Hit</button>
            <button id="standbtn" class="standbtn">Stand</button>
            <button id="startbtn" class="Start">Start</button>
        </div>


        <p id="pott"></p>
        <input type="number" id="bet-input" placeholder="Satsa belopp">
        <button id="fyllpå">Fyll på (+100)</button>
        <div id="computer-cards"><h1>computer-cards</h1></div>

        <p id ="player-score"></p>


    </div>

</body>
</html>
